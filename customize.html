<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎨 تخصيص متجري | Earnify</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--p2:#10b981;--bg:#f4f7f6;--card:#fff;--line:rgba(15,118,110,.14);--tx:#0f172a;--mut:#5b6b7a;--rad:18px;--sh:0 10px 30px -14px rgba(15,118,110,.22)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Cairo;background:var(--bg);color:var(--tx);padding-bottom:40px}
.hd{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.hd b{font-size:1.05rem}.hd a{color:var(--p);text-decoration:none;font-size:.8rem;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h3{font-size:.95rem;margin-bottom:12px;color:var(--p)}
label{display:block;font-size:.78rem;font-weight:700;margin:10px 0 6px;color:var(--mut)}
input[type=text],input[type=color],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:.9rem}
input[type=color]{height:46px;padding:4px;cursor:pointer}
.up{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:#fbfdfc;font-size:.82rem;color:var(--mut);font-weight:700}
.up:hover{border-color:var(--p2)}
.prev{margin-top:10px;border-radius:12px;max-height:120px;width:100%;object-fit:cover;display:none}
.bans{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bans img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.btn{width:100%;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:1rem;margin-top:8px}
.link{background:#eef5f2;border-radius:12px;padding:12px;font-size:.8rem;word-break:break-all;font-weight:700;color:var(--p);display:flex;gap:8px;align-items:center;justify-content:space-between}
.msg{text-align:center;font-weight:700;font-size:.85rem;margin-top:10px}
</style></head><body>
<div class="hd"><b>🎨 تخصيص متجري</b><a href="/store">→ رجوع للمتجر</a></div>
<div class="wrap">
<div class="card"><h3>🏪 هوية متجرك</h3>
<label>اسم المتجر</label><input type="text" id="tName" placeholder="مثال: متجر النخبة">
<label>العنوان الرئيسي (الهيرو)</label><input type="text" id="tHero" placeholder="تسوّق أحدث المنتجات">
<label>وصف قصير</label><input type="text" id="tSub" placeholder="شحن سريع • دفع عند الاستلام">
<label>اللون الأساسي</label><input type="color" id="tColor" value="#0f766e">
</div>
<div class="card"><h3>🖼️ صورة الهيدر / اللوجو</h3>
<div class="up" onclick="pick('logoIn')">📤 اضغط لرفع صورة الهيدر</div><input type="file" id="logoIn" accept="image/*" hidden>
<img class="prev" id="logoPrev">
</div>
<div class="card"><h3>🎯 بنرات العروض</h3>
<div class="up" onclick="pick('banIn')">➕ أضف بنر جديد</div><input type="file" id="banIn" accept="image/*" hidden>
<div class="bans" id="banList"></div>
</div>
<div class="card"><h3>🔗 رابطك بعد النشر</h3>
<div class="link"><span id="myLink">...</span><button class="btn" style="width:auto;padding:8px 14px;margin:0" onclick="copyL()">نسخ</button></div>
<button class="btn" onclick="openL()">👁️ معاينة متجري</button>
</div>
<button class="btn" onclick="save()">💾 حفظ ونشر متجري</button>
<div class="msg" id="msg"></div>
</div>
<script>
var tok=localStorage.getItem('etok')||'';if(!tok)location.href='/login';
var TH={name:'',hero:'',sub:'',color:'#0f766e',logo:'',banners:[]},myId='';
function pick(id){document.getElementById(id).click();}
fetch('/api/auth/me',{headers:{'x-auth-token':tok}}).then(r=>r.json()).then(function(d){
 var u=d.user||{};myId=u.id||'';
 document.getElementById('myLink').textContent=location.origin+'/r/'+myId;
 return fetch('/api/theme/'+myId);
}).then(r=>r.json()).then(function(d){
 if(d.theme){TH=d.theme;fill();}
});
function fill(){tName.value=TH.name||'';tHero.value=TH.hero||'';tSub.value=TH.sub||'';tColor.value=TH.color||'#0f766e';
 if(TH.logo){logoPrev.src=TH.logo;logoPrev.style.display='block';}
 renderBans();}
function renderBans(){document.getElementById('banList').innerHTML=(TH.banners||[]).map(function(b,i){return '<img src="'+b+'" onclick="rmBan('+i+')">';}).join('');}
function rmBan(i){TH.banners.splice(i,1);renderBans();}
document.getElementById('logoIn').onchange=e=>{var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=()=>{up(r.result).then(u=>{TH.logo=u;logoPrev.src=u;logoPrev.style.display='block';});};r.readAsDataURL(f);};
document.getElementById('banIn').onchange=e=>{var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=()=>{up(r.result).then(u=>{TH.banners=TH.banners||[];TH.banners.push(u);renderBans();});};r.readAsDataURL(f);};
function up(b64){return fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json','x-auth-token':tok},body:JSON.stringify({data:b64})}).then(r=>r.json()).then(d=>d.url);}
function save(){TH.name=tName.value;TH.hero=tHero.value;TH.sub=tSub.value;TH.color=tColor.value;
 fetch('/api/my/theme',{method:'POST',headers:{'Content-Type':'application/json','x-auth-token':tok},body:JSON.stringify(TH)}).then(r=>r.json()).then(function(d){
  var m=document.getElementById('msg');m.textContent=d.ok?'✅ تم حفظ ونشر متجري بنجاح!':'⚠️ '+d.error;m.style.color=d.ok?'#059669':'#dc2626';});}
function copyL(){var l=document.getElementById('myLink').textContent;if(navigator.clipboard)navigator.clipboard.writeText(l);prompt('انسخ رابطك:',l);}
function openL(){window.open(location.origin+'/r/'+myId,'_blank');}
</script></body></html>
