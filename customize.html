<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎨 تخصيص متجري | Earnify</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--p2:#10b981;--bg:#f4f7f6;--card:#fff;--line:rgba(15,118,110,.14);--tx:#0f172a;--mut:#5b6b7a;--rad:18px;--sh:0 10px 30px -14px rgba(15,118,110,.22)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Cairo;background:var(--bg);color:var(--tx);padding-bottom:40px}
.hd{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9}
.hd b{font-size:1.05rem}.hd a{color:var(--p);text-decoration:none;font-size:.8rem;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card h3{font-size:.95rem;margin-bottom:12px;color:var(--p)}
label{display:block;font-size:.78rem;font-weight:700;margin:10px 0 6px;color:var(--mut)}
input[type=text],input[type=color]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:.9rem}
input[type=color]{height:46px;padding:4px;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;cursor:pointer;transition:.2s;background:#fbfdfc}
.tcard.sel{border-color:var(--p);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.tcard .sw{height:52px;border-radius:10px;margin-bottom:6px}
.tcard span{font-size:.68rem;font-weight:700;color:var(--mut)}
.up{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:#fbfdfc;font-size:.82rem;color:var(--mut);font-weight:700}
.prev{margin-top:10px;border-radius:12px;max-height:120px;width:100%;object-fit:cover;display:none}
.bans{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bans img{width:70px;height:70px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.btn{width:100%;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:1rem;margin-top:8px}
.link{background:#eef5f2;border-radius:12px;padding:12px;font-size:.8rem;word-break:break-all;font-weight:700;color:var(--p);display:flex;gap:8px;align-items:center;justify-content:space-between}
.msg{text-align:center;font-weight:700;font-size:.85rem;margin-top:10px}

.tgrid{grid-template-columns:repeat(2,1fr)}
.tcard{padding:10px}
.pv{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.pv-hd{height:10px}
.pv-hero{height:26px}
.pv-grid{display:flex;gap:4px;padding:6px}
.pv-grid i{flex:1;height:26px;border-radius:5px}
.tcard .nm{font-size:.72rem;font-weight:800;color:var(--tx)}
.tcard .cat{font-size:.6rem;color:var(--mut);display:block;margin:2px 0 6px}
.tbtns{display:flex;gap:6px}
.tbtns button{flex:1;border-radius:8px;padding:6px 0;font-size:.66rem;font-weight:800;cursor:pointer}
.act{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border:none}
.prevw{background:#fff;border:1px solid var(--line);color:var(--p)}
.free{position:absolute;top:6px;left:6px;background:rgba(16,185,129,.15);color:#059669;font-size:.58rem;font-weight:800;border-radius:50px;padding:2px 8px}
.tcard{position:relative}
.code{font-family:"Courier New",monospace;background:#0f172a;color:#7ee787;border:1px solid #1e293b;border-radius:12px;padding:12px;font-size:.75rem;width:100%;direction:ltr;text-align:left}
</style></head><body>
<div class="hd"><b>🎨 تخصيص متجري</b><a href="/store">→ رجوع للمتجر</a></div>
<div class="wrap">
<div class="card"><h3>🎁 ثيمات جاهزة — اختار بضغطة</h3><div class="tgrid" id="tGrid"></div></div>
<div class="card"><h3>🏪 هوية متجرك</h3>
<label>اسم المتجر</label><input type="text" id="tName" placeholder="مثال: متجر النخبة">
<label>العنوان الرئيسي (الهيرو)</label><input type="text" id="tHero" placeholder="تسوّق أحدث المنتجات">
<label>وصف قصير</label><input type="text" id="tSub" placeholder="شحن سريع • دفع عند الاستلام">
<label>رقم واتساب (للزر العائم)</label><input type="text" id="tWa" placeholder="201xxxxxxxxx">
<label>اللون الأساسي (أو اختار ثيم جاهز فوق)</label><input type="color" id="tColor" value="#0f766e">
</div>
<div class="card"><h3>🖼️ صورة الهيدر / اللوجو</h3><div class="up" onclick="pick('logoIn')">📤 اضغط لرفع صورة الهيدر</div><input type="file" id="logoIn" accept="image/*" hidden><img class="prev" id="logoPrev"></div>
<div class="card"><h3>🎯 بنرات العروض</h3><div class="up" onclick="pick('banIn')">➕ أضف بنر جديد</div><input type="file" id="banIn" accept="image/*" hidden><div class="bans" id="banList"></div></div>
<div class="card"><h3>🔗 رابطك بعد النشر</h3><div class="link"><span id="myLink">...</span><button class="btn" style="width:auto;padding:8px 14px;margin:0" onclick="copyL()">نسخ</button></div><button class="btn" onclick="openL()">👁️ معاينة متجري</button></div>
<div class="card"><h3>💻 تخصيص بالكود (للمحترفين)</h3><label>CSS مخصص — عدّل أي شكل</label><textarea id="tCss" class="code" rows="6" placeholder="/* مثال: */
.hero{border-radius:0}
.pcard{border:2px solid gold}"></textarea><label>HTML إضافي — أضف أي عنصر</label><textarea id="tHtml" class="code" rows="3" placeholder="<div style='text-align:center;padding:10px'>رسالتك هنا</div>"></textarea><label>JavaScript — أضف أي وظيفة</label><textarea id="tJs" class="code" rows="3" placeholder="// مثال: console.log('متجري')"></textarea></div>
<button class="btn" onclick="save()">💾 حفظ ونشر متجري</button>
<div class="msg" id="msg"></div>
</div>
<script>
var tok=localStorage.getItem('etok')||'';if(!tok)location.href='/login';
var TH={name:'',hero:'',sub:'',color:'#0f766e',color2:'#10b981',logo:'',banners:[]},myId='';
var THEMES=[
{id:'modern',n:'مودرن',cat:'عام',bg:'#f7faf9',hd:'#0f766e',hero:'linear-gradient(135deg,#10b981,#0f766e)',card:'#fff'},
{id:'elite',n:'ELITE Fit',cat:'الصحة واللياقة',bg:'#111827',hd:'#ef4444',hero:'linear-gradient(135deg,#7f1d1d,#111827)',card:'#1f2937'},
{id:'luxe',n:'LUXE',cat:'ساعات ومجوهرات',bg:'#0b0b0d',hd:'#d4af37',hero:'linear-gradient(135deg,#1a1a1d,#0b0b0d)',card:'#141417'},
{id:'rosa',n:'ROSA',cat:'ملابس وأزياء',bg:'#fff5f7',hd:'#db2777',hero:'linear-gradient(135deg,#fbcfe8,#db2777)',card:'#fff'}];
function renderT(){tGrid.innerHTML=THEMES.map(function(t,i){return '<div class="tcard'+((TH.id===t.id)?' sel':'')+'" id="tc'+i+'"><span class="free">مجاني</span><div class="pv" style="background:'+t.bg+'"><div class="pv-hd" style="background:'+t.hd+'"></div><div class="pv-hero" style="background:'+t.hero+'"></div><div class="pv-grid"><i style="background:'+t.card+'"></i><i style="background:'+t.card+'"></i></div></div><div class="nm">'+t.n+'</div><span class="cat">'+t.cat+'</span><div class="tbtns"><button class="act" onclick="pickT('+i+')">تفعيل</button><button class="prevw" onclick="prevT('+i+')">👁 معاينة</button></div></div>';}).join('');}
function markSel(){THEMES.forEach(function(t,i){var el=document.getElementById('tc'+i);if(el)el.className='tcard'+((t.c===TH.color&&t.c2===TH.color2)?' sel':'');});}
function pickT(i){TH.id=THEMES[i].id;TH.color=THEMES[i].hd;renderT();save();}
function prevT(i){window.open(location.origin+'/shop?theme='+THEMES[i].id,'_blank');}
renderT();
function pick(id){document.getElementById(id).click();}
fetch('/api/auth/me',{headers:{'x-auth-token':tok}}).then(r=>r.json()).then(function(d){
 var u=d.user||{};myId=u.id||'';myLink.textContent=location.origin+'/r/'+myId;
 return fetch('/api/theme/'+myId);
}).then(r=>r.json()).then(function(d){if(d.theme){TH=Object.assign(TH,d.theme);fill();markSel();}});
function fill(){tName.value=TH.name||'';tHero.value=TH.hero||'';tSub.value=TH.sub||'';# tWa
 tWa.value=TH.whatsapp||'';tColor.value=TH.color||'#0f766e';
 if(TH.logo){logoPrev.src=TH.logo;logoPrev.style.display='block';}renderBans();tCss.value=TH.customCss||'';tHtml.value=TH.customHtml||'';tJs.value=TH.customJs||'';}
function renderBans(){banList.innerHTML=(TH.banners||[]).map(function(b,i){return '<img src="'+b+'" onclick="rmBan('+i+')">';}).join('');}
function rmBan(i){TH.banners.splice(i,1);renderBans();}
logoIn.onchange=e=>{var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=()=>{up(r.result).then(u=>{TH.logo=u;logoPrev.src=u;logoPrev.style.display='block';});};r.readAsDataURL(f);};
banIn.onchange=e=>{var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=()=>{up(r.result).then(u=>{TH.banners=TH.banners||[];TH.banners.push(u);renderBans();});};r.readAsDataURL(f);};
function up(b64){return fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json','x-auth-token':tok},body:JSON.stringify({data:b64})}).then(r=>r.json()).then(d=>d.url);}
function save(){TH.name=tName.value;TH.hero=tHero.value;TH.sub=tSub.value;TH.color=tColor.value;TH.whatsapp=tWa.value;TH.customCss=tCss.value;TH.customHtml=tHtml.value;TH.customJs=tJs.value;
 fetch('/api/my/theme',{method:'POST',headers:{'Content-Type':'application/json','x-auth-token':tok},body:JSON.stringify(TH)}).then(r=>r.json()).then(function(d){
  msg.textContent=d.ok?'✅ تم حفظ ونشر متجري بنجاح!':'⚠️ '+d.error;msg.style.color=d.ok?'#059669':'#dc2626';});}
function copyL(){if(navigator.clipboard)navigator.clipboard.writeText(myLink.textContent);prompt('انسخ رابطك:',myLink.textContent);}
function openL(){window.open(location.origin+'/r/'+myId,'_blank');}
</script></body></html>
