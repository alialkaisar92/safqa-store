<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المسوق | Rab7na</title>
<style>
:root{--p:#0f766e;--pd:#0b5d56;--soft:#e9f7f3;--bg:#f7faf9;--ink:#172033;--mut:#71817a;--line:#e5eeea;--gold:#c9972b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:auto;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:1.6rem;font-weight:900;color:var(--pd)}.logo span{color:var(--gold)}
.back{border:0;background:var(--soft);color:var(--pd);padding:10px 14px;border-radius:12px;font-weight:800}
main{max-width:1100px;margin:auto;padding:22px 16px 40px}
.hero{background:linear-gradient(135deg,#0f766e,#0b5d56);color:#fff;border-radius:22px;padding:24px;margin-bottom:16px}
.hero small{opacity:.8}.balance{font-size:2rem;font-weight:900;margin-top:7px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 6px 20px rgba(15,23,42,.04)}
.stat small{display:block;color:var(--mut);margin-bottom:8px}.stat b{font-size:1.25rem;color:var(--pd)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.title{font-weight:900;font-size:1rem;margin-bottom:12px}
.order{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.order:last-child{border-bottom:0}.oid{font-weight:900}.meta{font-size:.75rem;color:var(--mut);margin-top:4px}
.status{padding:5px 9px;border-radius:8px;background:var(--soft);color:var(--pd);font-size:.7rem;font-weight:900}
.profit{color:var(--gold);font-weight:900;font-size:.8rem}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.action{border:0;background:var(--pd);color:#fff;padding:11px 15px;border-radius:12px;font-weight:800}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.order{align-items:flex-start}.balance{font-size:1.6rem}}
</style>
</head>
<body>
<header><div class="top">
<div class="logo">Rab<span>7na</span></div>
<button class="back" onclick="location.href='/store'">← العودة للمتجر</button>
</div></header>

<main>
<section class="hero">
<small>لوحة تحكم المسوق</small>
<div class="balance" id="balance">0 ج.م</div>
<div style="margin-top:5px;opacity:.8">رصيدك الحالي</div>
</section>

<section class="grid">
<div class="stat"><small>إجمالي الطلبات</small><b id="orders">0</b></div>
<div class="stat"><small>طلبات قيد التنفيذ</small><b id="pending">0</b></div>
<div class="stat"><small>طلبات مكتملة</small><b id="done">0</b></div>
<div class="stat"><small>الأرباح المتوقعة</small><b id="profit">0 ج.م</b></div>
</section>

<div class="card">
<div class="title">إدارة الطلبات</div>
<div class="actions">
<button class="action" onclick="location.href='/orders'">📦 متابعة الطلبات</button>
<button class="action" onclick="location.href='/store'">🛍️ تصفح المنتجات</button>
</div>
</div>

<div class="card">
<div class="title">آخر الطلبات</div>
<div id="list">جاري التحميل...</div>
</div>
</main>

<script>
function money(n){return Number(n||0).toLocaleString('ar-EG')+' ج.م'}
async function load(){
 try{
  const r=await fetch('/api/me',{credentials:'include'});
  const d=await r.json();
  document.getElementById('balance').textContent=money(d.balance);
  const orders=d.orders||[];
  document.getElementById('orders').textContent=orders.length;
  document.getElementById('pending').textContent=orders.filter(x=>!['delivered','completed','مكتمل','تم التسليم'].includes(String(x.status||'').toLowerCase())).length;
  document.getElementById('done').textContent=orders.filter(x=>['delivered','completed','مكتمل','تم التسليم'].includes(String(x.status||'').toLowerCase())).length;
  document.getElementById('profit').textContent=money(orders.reduce((s,x)=>s+Number(x.commission||x.profit||0),0));

  document.getElementById('list').innerHTML=orders.slice(-8).reverse().map((x,i)=>`
   <div class="order">
    <div><div class="oid">طلب #${x.id||x.order_id||i+1}</div>
    <div class="meta">${x.created_at||x.date||'—'}</div></div>
    <div style="text-align:left"><div class="status">${x.status||'جديد'}</div>
    <div class="profit">${money(x.commission||x.profit||0)}</div></div>
   </div>`).join('')||'<div style="color:#71817a;text-align:center;padding:20px">لا توجد طلبات حتى الآن</div>';
 }catch(e){document.getElementById('list').textContent='تعذر تحميل البيانات';}
}
load();
</script>
</body>
</html>
