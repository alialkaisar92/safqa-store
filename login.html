<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | Rab7na</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,Tajawal,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:linear-gradient(160deg,#0a3d2a,#0b5d3b 55%,#16a34a);display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:420px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
.top{background:linear-gradient(135deg,#0a3d2a,#16a34a);color:#fff;text-align:center;padding:26px 20px}
.top .lg{font-size:26px;font-weight:900}.top .lg b{color:#86efac}
.top p{font-size:13px;opacity:.9;margin-top:4px}
.tabs{display:flex}.tabs button{flex:1;padding:14px;border:none;background:#f2f6f3;font-weight:800;font-size:14px;color:#8aa094;cursor:pointer}
.tabs button.on{background:#fff;color:#0b5d3b;box-shadow:0 -3px 0 #16a34a inset}
form{padding:22px;display:none;flex-direction:column;gap:12px}
form.on{display:flex}
.fld label{display:block;font-size:12px;font-weight:800;color:#0b5d3b;margin-bottom:5px}
.fld input{width:100%;border:1.5px solid #e6eee9;border-radius:14px;padding:13px 14px;font-size:14px;outline:none;background:#f9fcfa}
.fld input:focus{border-color:#16a34a;box-shadow:0 0 0 4px #d1fae5}
.go{width:100%;background:linear-gradient(135deg,#0b5d3b,#16a34a);color:#fff;font-weight:900;font-size:15px;padding:15px;border:none;border-radius:14px;cursor:pointer;box-shadow:0 8px 20px -8px rgba(22,163,74,.5)}
.go:active{transform:scale(.98)}
.msg{font-size:13px;text-align:center;min-height:18px;font-weight:700}
.msg.err{color:#dc2626}.msg.ok{color:#16a34a}
.back{text-align:center;padding:0 0 18px}.back a{color:#0b5d3b;font-weight:700;font-size:13px;text-decoration:none}.forgot-link{border:0;background:none;color:#0b5d3b;font-size:12px;font-weight:800;cursor:pointer;text-align:right;padding:0}.forgot-panel{display:none;background:#f3faf5;border:1px solid #d8eee0;border-radius:14px;padding:13px;gap:8px}.forgot-panel.on{display:flex;flex-direction:column}.forgot-panel p{font-size:12px;line-height:1.7;color:#607268}.forgot-panel input{width:100%;border:1px solid #d9e8df;border-radius:10px;padding:10px;background:#fff;direction:ltr;text-align:left}.forgot-btn{border:0;border-radius:10px;padding:10px;background:#d9f4e1;color:#0b5d3b;font-weight:900;cursor:pointer}
</style><link rel="stylesheet" href="/polish.css?v=2">
</head><body>
<div class="box">
  <div class="top"><div class="lg">Rab<b>7na</b></div><p>منصة التسويق بالعمولة — سوق واربح</p></div>
  <div class="tabs">
    <button id="tLogin" class="on" onclick="tab('login')">تسجيل الدخول</button>
    <button id="tReg" onclick="tab('reg')">إنشاء حساب</button>
  </div>
  <form id="fLogin" class="on" onsubmit="doLogin(event)">
    <div class="fld"><label>البريد الإلكتروني</label><input id="lEmail" type="email" placeholder="name@example.com" autocomplete="email" required></div>
    <div class="fld"><label>كلمة المرور</label><input id="lPass" type="password" placeholder="••••••••" required></div>
    <button type="button" class="forgot-link" onclick="toggleForgot()">نسيت كلمة المرور؟</button>
    <div id="forgotPanel" class="forgot-panel">
      <p>اكتب بريدك وسنرسل لك رابطًا آمنًا لإعادة تعيين كلمة المرور إذا كان الحساب موجودًا.</p>
      <input id="forgotEmail" type="email" placeholder="name@example.com" autocomplete="email">
      <button type="button" class="forgot-btn" onclick="doForgot()">إرسال رابط الاستعادة</button>
      <div class="msg" id="forgotMsg" aria-live="polite"></div>
    </div>
    <div class="msg" id="lMsg"></div>
    <button class="go">دخول ←</button>
  </form>
  <form id="fReg" onsubmit="doReg(event)">
    <div class="fld"><label>الاسم الكامل</label><input id="rName" placeholder="اسمك" required></div>
    <div class="fld"><label>البريد الإلكتروني</label><input id="rEmail" type="email" placeholder="name@example.com" autocomplete="email" required></div>
    <div class="fld"><label>كلمة المرور</label><input id="rPass" type="password" placeholder="٨ أحرف على الأقل" minlength="8" required></div>
    <div class="msg" id="rMsg"></div>
    <button class="go">إنشاء الحساب ✓</button>
  </form>
  <div class="back"><a href="/store">← متابعة التسوق بدون حساب</a></div>
</div>
<script>
function tab(m){
  document.getElementById('tLogin').classList.toggle('on',m==='login');
  document.getElementById('tReg').classList.toggle('on',m==='reg');
  document.getElementById('fLogin').classList.toggle('on',m==='login');
  document.getElementById('fReg').classList.toggle('on',m==='reg');
}
if(location.hash==='#register')tab('reg');
if(new URLSearchParams(location.search).get('reset')==='1'){document.getElementById('lMsg').className='msg ok';document.getElementById('lMsg').textContent='✅ تم تغيير كلمة المرور، سجّل الدخول الآن';}
function toggleForgot(){var panel=document.getElementById('forgotPanel');panel.classList.toggle('on');if(panel.classList.contains('on')){var email=document.getElementById('forgotEmail');if(!email.value)email.value=document.getElementById('lEmail').value;email.focus();}}
async function doForgot(){var email=document.getElementById('forgotEmail').value.trim();var m=document.getElementById('forgotMsg');m.className='msg';m.textContent='جارٍ الإرسال...';try{var r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,return:safeReturnPath()})});var d=await r.json();if(!r.ok)throw new Error(d.error||'تعذر إرسال الطلب');m.className='msg ok';m.textContent=d.message||'إذا كان البريد مسجلًا ستصلك الرسالة خلال دقائق.';}catch(err){m.className='msg err';m.textContent=err.message||'تعذر إرسال الطلب حاليًا';}}
function save(){
  // جلسة المصادقة تُدار عبر HttpOnly cookie من الخادم، لا عبر localStorage.
}
function safeReturnPath(){
  var value=new URLSearchParams(location.search).get('return')||'/store';
  return value.startsWith('/')&&!value.startsWith('//')?value:'/store';
}
async function doLogin(e){e.preventDefault();var m=document.getElementById('lMsg');m.className='msg';m.textContent='⏳ ...';
  try{var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:lEmail.value,password:lPass.value})});
    var d=await r.json();
    if(r.ok&&(d.token||d.data&&d.data.token||d.ok)){save(d);m.className='msg ok';m.textContent='✅ تم الدخول';setTimeout(function(){location.href=safeReturnPath()},700);}
    else{m.className='msg err';m.textContent='⚠️ '+(d.error||d.message||'بيانات غير صحيحة');}
  }catch(err){m.className='msg err';m.textContent='⚠️ خطأ في الاتصال';}
}
async function doReg(e){e.preventDefault();var m=document.getElementById('rMsg');m.className='msg';m.textContent='⏳ ...';
  try{var r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rName.value,email:rEmail.value,password:rPass.value})});
    var d=await r.json();
    if(r.ok&&(d.token||d.data&&d.data.token||d.ok)){save(d);m.className='msg ok';m.textContent='✅ تم إنشاء الحساب';setTimeout(function(){location.href=safeReturnPath()},700);}
    else{m.className='msg err';m.textContent='⚠️ '+(d.error||d.message||'فشل التسجيل');}
  }catch(err){m.className='msg err';m.textContent='⚠️ خطأ في الاتصال';}
}
</script>


<style>
.benefits{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.benefits div{background:#e9f5ee;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;color:#0b5d3b}
.eye{position:absolute;left:12px;top:38px;border:none;background:none;font-size:16px;cursor:pointer}
.fld{position:relative}
</style>



</body></html>
