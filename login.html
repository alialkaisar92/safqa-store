<style>
*{box-sizing:border-box}html{background:#071c1b}body{margin:0;font-family:Cairo,Arial,sans-serif;background:radial-gradient(circle at 12% 15%,#1e9d8b 0,#0b4f4a 34%,#071c1b 78%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#102a2a;position:relative;overflow-x:hidden}body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);opacity:.18;pointer-events:none}body:before{width:340px;height:340px;background:#67e8d0;top:-150px;right:-120px}body:after{width:280px;height:280px;background:#fbbf24;bottom:-160px;left:-100px}.shell{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.45);border-radius:30px;overflow:hidden;box-shadow:0 28px 80px rgba(0,0,0,.3);position:relative;z-index:1}.hero{padding:52px 44px;background:linear-gradient(145deg,#0f766e,#0d4f4b);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:650px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:390px;height:390px;border:1px solid rgba(255,255,255,.16);border-radius:50%;left:-180px;bottom:-130px;box-shadow:0 0 0 34px rgba(255,255,255,.04),0 0 0 68px rgba(255,255,255,.035)}.brandmark{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.65rem;position:relative;z-index:1}.brandmark i{font-style:normal;display:grid;place-items:center;width:46px;height:46px;background:#fbbf24;color:#123c38;border-radius:15px;box-shadow:0 10px 24px #001f1b55}.hero-copy{position:relative;z-index:1;margin:auto 0}.hero h1{font-size:2.45rem;line-height:1.35;margin:22px 0 12px;letter-spacing:-1px}.hero p{color:#d8f7ef;line-height:2;font-size:.96rem;max-width:390px}.benefits{display:grid;gap:12px;position:relative;z-index:1}.benefit{display:flex;align-items:center;gap:10px;color:#e5fffa;font-size:.82rem}.benefit b{display:grid;place-items:center;width:28px;height:28px;background:#ffffff18;border:1px solid #ffffff25;border-radius:9px;color:#fbbf24}.card{background:#fff;padding:42px 40px;min-width:0}.logo{font-weight:900;font-size:1.65rem;color:#0f766e;letter-spacing:-.5px}.sub{color:#64748b;font-size:.8rem;margin:3px 0 24px}.tabs{display:flex;gap:5px;background:#f1f5f9;padding:5px;border-radius:15px;margin:0 0 20px}.tabs button{flex:1;padding:11px 8px;border:0;border-radius:11px;background:transparent;color:#64748b;font-weight:800;cursor:pointer;font-family:inherit;transition:.2s}.tabs button.on{background:#fff;color:#0f766e;box-shadow:0 4px 12px #0f766e14}label{display:block;font-size:.78rem;font-weight:800;color:#334155;margin:13px 0 5px}input{width:100%;padding:13px 14px;border:1px solid #dbe5e3;border-radius:13px;background:#fbfefd;font-family:inherit;font-size:.9rem;outline:none;transition:.2s}input::placeholder{color:#a0adaf}input:focus{border-color:#14b8a6;background:#fff;box-shadow:0 0 0 4px #14b8a61c}.go{width:100%;margin-top:17px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;font-weight:900;font-size:.95rem;cursor:pointer;font-family:inherit;box-shadow:0 9px 20px #0f766e2b;transition:.2s}.go:hover{transform:translateY(-1px);filter:brightness(1.04)}.go:disabled{opacity:.65;cursor:wait;transform:none}.secondary{width:100%;margin-top:9px;padding:11px;border:1px solid #dbe5e3;border-radius:12px;background:#fff;color:#0f766e;font-weight:800;cursor:pointer;font-family:inherit}.msg{text-align:center;font-size:.82rem;font-weight:700;margin:11px 0;min-height:1.2em}.back{text-align:center;margin-top:22px;font-size:.75rem;color:#94a3b8}.back a,.link{color:#0f766e;font-weight:800;text-decoration:none;cursor:pointer}.googleBox{margin:0 0 7px;text-align:center;min-height:42px}.googleBox:empty{display:none}.or{display:flex;align-items:center;gap:8px;color:#94a3b8;font-size:.72rem;margin:10px 0}.or:before,.or:after{content:"";height:1px;background:#e6eeec;flex:1}.hint{font-size:.73rem;color:#71808a;line-height:1.8;margin:9px 0;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:760px){body{padding:12px}.shell{display:block;max-width:500px;border-radius:24px}.hero{display:none}.card{padding:28px 22px}}@media(max-width:390px){.card{padding:24px 16px}.tabs button{font-size:.78rem}}
</style></head><body><main class="shell"><section class="hero"><div class="brandmark"><i>ر</i><span>rab7na</span></div><div class="hero-copy"><h1>ابدأ تجارتك<br>بخطوة أذكى</h1><p>منصة بسيطة تساعدك على اكتشاف المنتجات، التسويق لها، وتحقيق ربحك من كل عملية بيع.</p></div><div class="benefits"><div class="benefit"><b>✓</b><span>منتجات جاهزة للتسويق</span></div><div class="benefit"><b>✓</b><span>متابعة الطلبات والأرباح بسهولة</span></div><div class="benefit"><b>✓</b><span>دخول آمن عبر البريد أو Google</span></div></div></section><section class="card"><div class="logo">مرحبًا بك في rab7na</div><div class="sub">سجّل دخولك لإدارة تسويقك وأرباحك</div><div class="tabs"><button id="tL" class="on" onclick="tab('login')">تسجيل الدخول</button><button id="tR" onclick="tab('reg')">إنشاء حساب</button></div><div id="fbody"></div><p class="msg" id="msg"></p><div class="back"><a href="/store">الرجوع للمتجر</a> &nbsp;•&nbsp; <a href="/home">الصفحة الرئيسية</a></div></section></main>
<script>
var googleClientId='',pendingEmail='',mode='';
function msg(s,ok){var e=document.getElementById('msg');e.textContent=s||'';e.style.color=ok?'#16a34a':'#dc2626'}
function googleArea(){return '<div class="googleBox" id="googleBox"></div><div class="or">أو باستخدام بياناتك</div>'}
function renderGoogle(){var box=document.getElementById('googleBox');if(!box||!googleClientId)return;if(!window.google||!google.accounts||!google.accounts.id){setTimeout(renderGoogle,250);return}box.innerHTML='';google.accounts.id.initialize({client_id:googleClientId,callback:handleGoogle,auto_select:false,cancel_on_tap_outside:true,use_fedcm_for_prompt:true});google.accounts.id.renderButton(box,{theme:'outline',size:'large',width:320,text:'continue_with',shape:'rectangular',logo_alignment:'center'})}
async function handleGoogle(response){msg('جارٍ التحقق من Google…',true);try{var r=await fetch('/api/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:response.credential})});var d=await r.json();if(d.ok)done(d);else msg(d.error||'تعذر تسجيل الدخول عبر Google',false)}catch(e){msg('تعذر الاتصال بالخادم',false)}}
async function loadGoogle(){try{var r=await fetch('/api/auth/google-config');var d=await r.json();googleClientId=d.clientId||'';renderGoogle()}catch(e){}}
function tab(t){mode=t;document.getElementById('tL').classList.toggle('on',t==='login');document.getElementById('tR').classList.toggle('on',t==='reg');msg('');var b=document.getElementById('fbody');if(t==='login'){b.innerHTML=googleArea()+'<label>البريد أو اسم المستخدم أو رقم الهاتف</label><input id="liC" autocomplete="username"><label>كلمة المرور</label><input id="liP" type="password" autocomplete="current-password"><button class="go" onclick="doLogin()">دخول</button><p class="hint"><span class="link" onclick="forgot()">نسيت كلمة المرور؟ استعدها برمز البريد</span></p><p class="hint">ليس لديك حساب؟ <span class="link" onclick="tab(\'reg\')">إنشاء حساب جديد</span></p>'}else if(t==='reg'){b.innerHTML=googleArea()+'<label>البريد الإلكتروني</label><input id="rgE" type="email" autocomplete="email" placeholder="name@example.com"><label>رقم الموبايل</label><input id="rgPh" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01xxxxxxxxx"><label>اسم المستخدم</label><input id="rgU" autocomplete="username" placeholder="مثال: ahmed_2026"><label>كلمة المرور</label><input id="rgP" type="password" autocomplete="new-password"><label>إعادة كتابة كلمة المرور</label><input id="rgP2" type="password" autocomplete="new-password"><button class="go" onclick="doReg()">إنشاء الحساب وإرسال رمز البريد</button><p class="hint">سيصلك رمز مكوّن من 6 أرقام على البريد لتفعيل الحساب.</p>'}renderGoogle()}
function done(d){localStorage.setItem('etok',d.token);if(d.refresh)localStorage.setItem('ertok',d.refresh);localStorage.setItem('euser',JSON.stringify(d.user));location.href='/store'}
function jsonPost(url,data){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json()})}
function doLogin(){var c=document.getElementById('liC').value.trim(),p=document.getElementById('liP').value;if(!c||!p)return msg('اكتب بيانات الدخول أولًا',false);jsonPost('/api/auth/login',{contact:c,password:p}).then(function(d){if(d.ok)done(d);else msg(d.error||'بيانات الدخول غير صحيحة',false)}).catch(function(){msg('تعذر الاتصال بالخادم',false)})}
function doReg(){var email=document.getElementById('rgE').value.trim(),phone=document.getElementById('rgPh').value.trim(),username=document.getElementById('rgU').value.trim(),p=document.getElementById('rgP').value,p2=document.getElementById('rgP2').value;if(!email||!phone||!username||!p||!p2)return msg('أكمل كل البيانات أولًا',false);jsonPost('/api/auth/register',{email:email,phone:phone,username:username,name:username,display_name:username,password:p,password2:p2}).then(function(d){if(d.ok)done(d);else if(d.verificationRequired){pendingEmail=d.email;verifyRegister()}else msg(d.error||'تعذر إنشاء الحساب',false)}).catch(function(){msg('تعذر الاتصال بالخادم',false)})}
function verifyRegister(){document.getElementById('fbody').innerHTML='<label>رمز التحقق المرسل إلى '+pendingEmail+'</label><input id="rgCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><button class="go" onclick="doVerify()">تفعيل الحساب</button><button class="secondary" onclick="resendCode()">إعادة إرسال الرمز</button><p class="hint">الرمز صالح لمدة 10 دقائق.</p>';msg('تم إرسال رمز التحقق إلى بريدك',true)}
function doVerify(){var code=(document.getElementById('rgCode').value||'').trim();if(!/^\d{6}$/.test(code))return msg('اكتب الرمز المكوّن من 6 أرقام',false);jsonPost('/api/auth/email/verify',{email:pendingEmail,code:code}).then(function(d){if(d.ok)done(d);else msg(d.error||'رمز غير صحيح',false)}).catch(function(){msg('تعذر الاتصال بالخادم',false)})}
function resendCode(){jsonPost('/api/auth/email/resend',{email:pendingEmail}).then(function(d){msg(d.message||d.error||'تعذر إعادة الإرسال',!!d.ok)}).catch(function(){msg('تعذر الاتصال بالخادم',false)})}
function forgot(){mode='forgot';document.getElementById('tL').classList.remove('on');document.getElementById('tR').classList.remove('on');document.getElementById('fbody').innerHTML='<h3 style="margin:8px 0">استعادة كلمة المرور</h3><p class="hint">اكتب البريد المرتبط بحسابك، وسنرسل لك رمزًا من 6 أرقام.</p><label>البريد الإلكتروني</label><input id="fpE" type="email" autocomplete="email"><button class="go" onclick="requestReset()">إرسال رمز البريد</button><p class="hint"><span class="link" onclick="tab(\'login\')">العودة إلى تسجيل الدخول</span></p>';msg('')}
function requestReset(){var e=document.getElementById('fpE').value.trim();if(!e)return msg('اكتب بريدك الإلكتروني',false);pendingEmail=e;jsonPost('/api/auth/password/request',{email:e}).then(function(d){if(d.ok)resetForm();else msg(d.error||'تعذر إرسال الرمز',false)}).catch(function(){msg('تعذر الاتصال بالخادم',false)})}
function resetForm(){document.getElementById('fbody').innerHTML='<h3 style="margin:8px 0">تعيين كلمة مرور جديدة</h3><label>رمز البريد</label><input id="rsC" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"><label>كلمة المرور الجديدة</label><input id="rsP" type="password" autocomplete="new-password"><label>إعادة كتابة كلمة المرور</label><input id="rsP2" type="password" autocomplete="new-password"><button class="go" onclick="resetPassword()">حفظ كلمة المرور الجديدة</button><button class="secondary" onclick="forgot()">إرسال رمز جديد</button>';msg('تم إرسال الرمز إلى بريدك',true)}
function resetPassword(){var c=document.getElementById('rsC').value.trim(),p=document.getElementById('rsP').value,p2=document.getElementById('rsP2').value;if(!/^\d{6}$/.test(c)||!p||!p2)return msg('أكمل الرمز وكلمتي السر',false);jsonPost('/api/auth/password/reset',{email:pendingEmail,code:c,password:p,password2:p2}).then(function(d){if(d.ok){msg(d.message,true);setTimeout(function(){tab('login')},1200)}else msg(d.error||'تعذر تغيير كلمة المرور',false)}).catch(function(){msg('تعذر الاتصال بالخادم',false)})}
tab('login');loadGoogle();
</script></body></html>
