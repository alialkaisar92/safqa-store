<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎨 متجر الثيمات | Earnify</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#0f766e;--p2:#10b981;--bg:#f4f7f6;--card:#fff;--line:rgba(15,118,110,.14);--tx:#0f172a;--mut:#5b6b7a;--sh:0 10px 30px -14px rgba(15,118,110,.22)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Cairo;background:var(--bg);color:var(--tx);padding-bottom:50px}
button{font-family:inherit;cursor:pointer;border:none}input,select{font-family:inherit}
.hd{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.hd b{font-size:1.1rem}.hd a{color:var(--p);font-size:.8rem;font-weight:700;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:.9rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:50px;padding:7px 16px;font-size:.78rem;font-weight:700;color:var(--mut)}
.chip.on{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden;position:relative;transition:transform .2s,box-shadow .2s;animation:up .4s}
.tcard:hover{transform:translateY(-4px)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.pv{height:150px;position:relative;overflow:hidden}
.pv .ph{height:16px}.pv .he{height:52px}.pv .gg{display:flex;gap:6px;padding:8px}.pv .gg i{flex:1;height:52px;border-radius:8px}
.bd{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.b{font-size:.62rem;font-weight:800;border-radius:50px;padding:3px 10px}
.b.free{background:rgba(16,185,129,.15);color:#059669}.b.prem{background:rgba(245,158,11,.18);color:#b45309}
.b.inst{background:rgba(37,99,235,.15);color:#1d4ed8}
.tinfo{padding:14px}
.tinfo h3{font-size:1rem}.tinfo p{font-size:.76rem;color:var(--mut);margin:4px 0 6px;min-height:2.2em}
.tcat{font-size:.66rem;color:var(--p);font-weight:700}
.tbtns{display:flex;gap:6px;margin-top:10px}
.tbtns button{flex:1;border-radius:10px;padding:9px 0;font-size:.74rem;font-weight:800}
.bv{background:#fff;border:1px solid var(--line);color:var(--p)}
.bc{background:#eef5f2;color:var(--p)}
.ba{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff}
.sk{border-radius:18px;height:280px;background:linear-gradient(90deg,#eee 25%,#f8f8f8 50%,#eee 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}
.box{background:#fff;border-radius:20px;width:100%;max-width:900px;max-height:92vh;overflow:auto;padding:16px}
.box .x{float:left;background:#f1f5f9;border-radius:50%;width:32px;height:32px}
.dbar{display:flex;gap:8px;align-items:center;margin:8px 0}
.dbar button{background:#eef5f2;border-radius:10px;padding:7px 12px;font-size:.8rem}
.dbar button.on{background:var(--p);color:#fff}
.dbar .full{margin-right:auto;background:var(--p2);color:#fff}
iframe.pvif{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;transition:width .3s;margin:0 auto;display:block}
.cust{display:flex;gap:14px;flex-wrap:wrap}
.cust .side{flex:1;min-width:230px}
.cust .main{flex:1.4;min-width:260px}
.side label{display:block;font-size:.74rem;font-weight:700;margin:10px 0 5px;color:var(--mut)}
.side input,.side select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:.85rem}
.side input[type=color]{height:40px;padding:3px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--tx);color:#fff;border-radius:50px;padding:11px 22px;font-size:.85rem;font-weight:700;z-index:200;opacity:0;transition:.3s}
.toast.on{opacity:1}
.code{font-family:"Courier New",monospace;background:#0f172a;color:#7ee787;border:1px solid #1e293b;border-radius:10px;padding:10px;font-size:.72rem;width:100%;direction:ltr;text-align:left}
</style></head><body>
<div class="hd"><b>🎨 متجر الثيمات</b><a href="/store">→ رجوع</a></div>
<div class="wrap">
<div class="tools"><input id="q" placeholder="🔍 ابحث عن ثيم..." oninput="render()"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</div>

<div class="modal" id="pvM"><div class="box"><button class="x" onclick="cl('pvM')">✕</button><h3 id="pvT" style="margin-bottom:4px"></h3>
<div class="dbar"><button class="on" onclick="dev(this,375)">📱 موبايل</button><button onclick="dev(this,768)">📱 تابلت</button><button onclick="dev(this,'100%')">💻 ديسكتوب</button><button class="full" onclick="full()">⛶ نافذة كاملة</button></div>
<iframe class="pvif" id="pvF" height="520"></iframe></div></div>

<div class="modal" id="cuM"><div class="box"><button class="x" onclick="cl('cuM')">✕</button><h3 id="cuT" style="margin-bottom:8px">🎛️ محرر الثيم</h3>
<div class="cust"><div class="side">
<label>اللون الأساسي</label><input type="color" id="cP" oninput="live()">
<label>اللون الثانوي</label><input type="color" id="cS" oninput="live()">
<label>لون الخلفية</label><input type="color" id="cB" oninput="live()">
<label>استدارة الزوايا</label><input type="range" id="cR" min="0" max="28" oninput="live()">
<label>شكل الهيدر</label><select id="cH" onchange="live()"><option value="classic">كلاسيك</option><option value="centered">وسط</option><option value="minimal">نحيف</option></select>
<label>شكل الهيرو</label><select id="cHe" onchange="live()"><option value="large">كبير</option><option value="banner">بانر</option><option value="split">مقسم</option></select>
<label>شكل كارت المنتج</label><select id="cC" onchange="live()"><option value="rounded">دائري</option><option value="soft">ناعم</option><option value="sharp">حاد</option><option value="luxury">فاخر</option></select>
<label>شكل الأزرار</label><select id="cBu" onchange="live()"><option value="pill">دائرية</option><option value="sharp">حادة</option></select>
<button onclick="location.href='/code'" style="width:100%;background:#0e639c;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:.8rem;margin-bottom:10px">⛶ محرر الأكواد — شاشة كاملة</button>
<label>💻 CSS مخصص</label><textarea id="tCss" class="code" rows="4" oninput="live()" placeholder="/* عدّل أي شكل */"></textarea><label>💻 HTML إضافي</label><textarea id="tHtml" class="code" rows="2" placeholder="<div>عنصر إضافي</div>"></textarea><label>💻 JavaScript</label><textarea id="tJs" class="code" rows="2" placeholder="// وظيفة إضافية"></textarea>
<button class="ba" style="width:100%;border-radius:12px;padding:12px;margin-top:14px;font-weight:800" onclick="saveCustom()">💾 حفظ التخصيص</button>
</div><div class="main"><iframe class="pvif" id="cuF" height="520"></iframe></div></div></div></div>

<div class="modal" id="cfM"><div class="box" style="max-width:400px;text-align:center"><h3 style="margin:10px 0">تطبيق الثيم؟</h3><p id="cfTxt" style="color:var(--mut);font-size:.85rem;margin-bottom:16px"></p><div style="display:flex;gap:8px"><button class="ba" style="flex:1;border-radius:12px;padding:12px;font-weight:800" onclick="doApply()">✔ تطبيق</button><button class="bv" style="flex:1;border-radius:12px;padding:12px;font-weight:800" onclick="cl('cfM')">إلغاء</button></div></div></div>
<div class="toast" id="toast"></div>

<script src="/themes.js"></script>
<script>
var tok=localStorage.getItem('etok')||'';if(!tok)location.href='/login';
var myId='',cur='',pend='',myTheme={},filter='الكل';
var CATS=['الكل','مجاني','Premium','عام','ملابس','إلكترونيات','إكسسوارات'];
fetch('/api/auth/me',{headers:{'x-auth-token':tok}}).then(r=>r.json()).then(d=>{myId=(d.user||{}).id||'';return fetch('/api/theme/'+myId)}).then(r=>r.json()).then(d=>{myTheme=d.theme||{};render();});
document.getElementById('chips').innerHTML=CATS.map(c=>'<button class="chip'+(c===filter?' on':'')+'" onclick="setF(\''+c+'\')">'+c+'</button>').join('');
function setF(f){filter=f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.textContent===f));render();}
function render(){
 var g=document.getElementById('grid');g.innerHTML='<div class="sk"></div>'.repeat(6);
 var q=(document.getElementById('q').value||'').trim();
 setTimeout(function(){
  var list=THEMES.filter(t=>{
   if(filter==='مجاني'&&!t.isPremium===false)return false;
   if(filter==='مجاني'&&t.isPremium)return false;
   if(filter==='Premium'&&!t.isPremium)return false;
   if(filter!=='الكل'&&filter!=='مجاني'&&filter!=='Premium'&&t.category!==filter)return false;
   if(q&&(t.name+t.desc).indexOf(q)===-1)return false;
   return true;});
  g.innerHTML=list.map(t=>{
   var inst=myTheme.activeTheme===t.id;
   return '<div class="tcard"><div class="pv" style="background:'+t.colors.background+'"><div class="bd">'+(t.isPremium?'<span class="b prem">Premium</span>':'<span class="b free">مجاني</span>')+(inst?'<span class="b inst">مثبت حالياً</span>':'')+'</div><div class="ph" style="background:'+t.colors.card+'"></div><div class="he" style="background:linear-gradient(135deg,'+t.colors.secondary+','+t.colors.primary+')"></div><div class="gg"><i style="background:'+t.colors.card+'"></i><i style="background:'+t.colors.card+'"></i><i style="background:'+t.colors.card+'"></i></div></div><div class="tinfo"><h3>'+t.name+'</h3><p>'+t.desc+'</p><span class="tcat">'+t.category+' • v'+t.version+'</span><div class="tbtns"><button class="bv" onclick="openPv(\''+t.id+'\')">👁 معاينة</button><button class="bc" onclick="openCu(\''+t.id+'\')">🎛️ تخصيص</button><button class="ba" onclick="askApply(\''+t.id+'\')">تطبيق</button></div></div></div>';
  }).join('')||'<div style="grid-column:1/-1;text-align:center;color:var(--mut);padding:40px">لا توجد ثيمات مطابقة</div>';
 },300);
}
function getT(id){return THEMES.find(x=>x.id===id)}
function openPv(id){cur=id;pvT.textContent='معاينة: '+getT(id).name;pvF.src='/shop?theme='+id;op('pvM');}
function dev(b,w){document.querySelectorAll('.dbar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');pvF.style.width=w;}
function full(){window.open('/shop?theme='+cur,'_blank');}
function openCu(id){cur=id;var t=getT(id);cuT.textContent='🎛️ تخصيص: '+t.name;
 cP.value=t.colors.primary;cS.value=t.colors.secondary;cB.value=t.colors.background;cR.value=parseInt(t.layout.radius);cH.value=t.layout.header;cHe.value=t.layout.hero;cC.value=t.layout.card;cBu.value=t.layout.button;
 tCss.value=myTheme.customCss||'';tHtml.value=myTheme.customHtml||'';tJs.value=myTheme.customJs||'';cuF.src='/shop?theme='+id;op('cuM');}
function live(){var s={colors:{primary:cP.value,secondary:cS.value,background:cB.value},layout:{radius:cR.value+'px',header:cH.value,hero:cHe.value,card:cC.value,button:cBu.value}};
 s.customCss=tCss.value;cuF.contentWindow.postMessage({type:'themeLive',themeId:cur,settings:s},'*');}
function saveCustom(){var s={colors:{primary:cP.value,secondary:cS.value,background:cB.value},layout:{radius:cR.value+'px',header:cH.value,hero:cHe.value,card:cC.value,button:cBu.value}};
 post({activeTheme:cur,themeSettings:s,customCss:tCss.value,customHtml:tHtml.value,customJs:tJs.value,previousTheme:myTheme.activeTheme||null},function(){myTheme.activeTheme=cur;myTheme.themeSettings=s;myTheme.customCss=tCss.value;toast('💾 تم حفظ التخصيص');render();});}
function askApply(id){pend=id;cfTxt.textContent='هل تريد تطبيق ثيم「'+getT(id).name+'」على متجرك؟ لن تفقد أي منتجات أو طلبات.';op('cfM');}
function doApply(){var t=getT(pend);post({activeTheme:pend,themeSettings:myTheme.themeSettings||null,previousTheme:myTheme.activeTheme||null},function(){myTheme.previousTheme=myTheme.activeTheme;myTheme.activeTheme=pend;cl('cfM');toast('✅ تم تطبيق '+t.name);render();});}
function post(body,cb){fetch('/api/my/theme',{method:'POST',headers:{'Content-Type':'application/json','x-auth-token':tok},body:JSON.stringify(Object.assign({},myTheme,body))}).then(r=>r.json()).then(cb);}
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');setTimeout(function(){toastEl.classList.remove('on')},2200);}
var toastEl=document.getElementById('toast');
function op(id){document.getElementById(id).classList.add('on');}
function cl(id){document.getElementById(id).classList.remove('on');}
</script></body></html>
