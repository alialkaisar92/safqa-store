<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta name="robots" content="noindex,nofollow,noarchive"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rab7na | لوحة الإدارة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--g:#0f766e;--g2:#10b981;--bg:#f4f7f6;--card:#fff;--tx:#0f172a;--mut:#64748b;--line:rgba(15,118,110,.14);--dark:#0f172a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo}body{background:var(--bg);color:var(--tx)}
.topbar{position:sticky;top:0;z-index:60;background:var(--dark);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:10px}
.topbar .logo{font-weight:900;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.topbar .adm{background:rgba(255,255,255,.1);border-radius:50px;padding:6px 14px;font-size:.75rem;font-weight:700}
.burger{background:#1e293b;border:none;border-radius:12px;width:42px;height:42px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.burger span{width:20px;height:2.5px;background:#fff;border-radius:2px}
.drawer{position:fixed;top:0;bottom:0;right:0;width:270px;background:var(--dark);z-index:120;transform:translateX(100%);transition:transform .3s;padding:16px 12px;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer .dhead{color:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center;padding:6px 10px 16px}
.drawer .dhead button{background:#1e293b;border:none;color:#fff;border-radius:10px;width:32px;height:32px;cursor:pointer}
.drawer .it{display:flex;gap:10px;align-items:center;padding:13px 14px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.88rem;margin-bottom:6px;color:#94a3b8}
.drawer .it.on{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:110;display:none}
.ovl.show{display:block}
.main{padding:12px;min-height:calc(100vh - 70px)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.card b{font-size:1.25rem;color:var(--g);display:block}
.card small{color:var(--mut);font-size:.7rem;font-weight:700}
.card:last-child:nth-child(odd){grid-column:1/-1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.panel h3{margin-bottom:10px;font-size:.95rem}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:9px 10px;font-size:.75rem;border-bottom:1px solid var(--line);text-align:right}
.tbl th{color:var(--g)}
.tbl td:first-child{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{display:inline-block;border-radius:20px;padding:3px 12px;font-size:.7rem;font-weight:800;margin:2px}

#admChat{position:fixed;inset:0;background:#e5ddd5;z-index:200;display:none;flex-direction:column}
.admChatHead{background:var(--g);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.admChatHead b{font-size:.95rem}
.admChatBody{flex:1;overflow-y:auto;padding:12px}
.admChatBar{background:#f0f0f0;padding:8px;display:flex;gap:8px;flex:0 0 auto}
</style></head><body>
<header class="topbar"><button class="burger" onclick="sbOpen()"><span></span><span></span><span></span></button><div class="logo">💰 Rab7na <small style="color:#64748b">إدارة</small></div><span class="adm">👑 أدمن</span></header>
<div class="ovl" id="ovl" onclick="sbClose()"></div>
<aside class="drawer" id="drawer"><div class="dhead">💰 الأقسام <button onclick="sbClose()">✕</button></div><div id="menu"></div></aside>
<main class="main"><div id="view"></div></main>
<script>
(function(){var nativeFetch=window.fetch;window.fetch=function(input,init){init=init||{};var url=typeof input==='string'?input:(input&&input.url)||'';if(url.indexOf('/api/admin')===0){var h=new Headers(init.headers||{});var tok=localStorage.getItem('etok')||'';if(tok&&!h.has('x-auth-token'))h.set('x-auth-token',tok);init.headers=h;}return nativeFetch(input,init).then(function(r){if((r.status===401||r.status===403)&&url.indexOf('/api/admin')===0){var v=document.getElementById('view');if(v)v.innerHTML='<div class="panel" style="text-align:center;padding:40px"><h3>🔒 دخول المدير مطلوب</h3><p style="color:var(--mut);margin:12px 0">سجّل الدخول بحساب المدير من الموقع أولاً، ثم افتح لوحة الإدارة مرة أخرى.</p><a href="/" style="color:var(--g);font-weight:800">العودة لتسجيل الدخول</a></div>';}return r;});};})();
var SEC=[{id:'stats',t:'📊 الإحصائيات'},{id:'orders',t:'📦 الطلبات'},{id:'products',t:'🏷️ المنتجات'},{id:'users',t:'👥 المستخدمون'},{id:'withdraw',t:'💰 السحوبات'},{id:'chat',t:'💬 شات الدعم'},{id:'notif',t:'🔔 الإشعارات'},{id:'settings',t:'⚙️ الإعدادات'}];
function menu(){document.getElementById('menu').innerHTML=SEC.map(function(s){return '<div class="it'+(s.id==='stats'?' on':'')+'" data-s="'+s.id+'" onclick="go(\''+s.id+'\')">'+s.t+'</div>'}).join('');}
function sbOpen(){document.getElementById('drawer').classList.add('open');document.getElementById('ovl').classList.add('show');}
function sbClose(){document.getElementById('drawer').classList.remove('open');document.getElementById('ovl').classList.remove('show');}
function clean(t){return t.replace(/^\S+\s/,'')}
function go(s){clearInterval(window._uT);clearInterval(window._wT);clearInterval(window._cT);var _ac=document.getElementById('admChat');if(_ac)_ac.style.display='none';document.querySelectorAll('.drawer .it').forEach(function(x){x.classList.toggle('on',x.dataset.s===s)});sbClose();
var t=SEC.find(function(x){return x.id===s});
if(s==='stats')rStats();else if(s==='orders')rOrders();else if(s==='products')rProducts();else if(s==='users')rUsers();else if(s==='withdraw')rWithdraw();else if(s==='chat')rChat();else if(s==='notif')rNotif();else if(s==='settings')rSettings();else document.getElementById('view').innerHTML='<div class="panel"><h3>🚧 قسم «'+clean(t.t)+'»</h3><p style="color:var(--mut);font-size:.85rem">لسه بيتبنى — قولي「كمّل في قسم '+clean(t.t)+'」</p></div>';}
function rStats(){fetch('/api/admin/stats').then(function(r){return r.json()}).then(function(d){
var AR='ar-EG';
var st='<div class="cards">'
+'<div class="card"><b>'+d.orders+'</b><small>إجمالي الطلبات</small></div>'
+'<div class="card"><b>'+d.sales+'</b><small>طلبات مسلّمة</small></div>'
+'<div class="card"><b>'+d.commission.toLocaleString(AR)+' ج.م</b><small>إجمالي العمولات</small></div>'
+'<div class="card"><b>'+d.users+'</b><small>المستخدمون</small></div>'
+'<div class="card"><b>'+d.products+'</b><small>المنتجات</small></div>'
+'<div class="card"><b>'+d.withdrawals+'</b><small>سحوبات معلقة</small></div>'
+'<div class="card"><b>'+d.chats+'</b><small>محادثات الدعم</small></div></div>';
var chips=Object.keys(d.byStatus).map(function(k){var col=k==='تم التسليم'?'#dcfce7;color:#047857':(k==='ملغي'?'#fee2e2;color:#b91c1c':'#fef3c7;color:#92400e');return '<span class="st" style="background:'+col+'">'+k+': '+d.byStatus[k]+'</span>'}).join('');
var rows=(d.recent||[]).map(function(o){return '<tr><td>#'+(o.id||'')+'</td><td>'+(o.client_name||o.name||'')+'</td><td>'+(o.commission||0)+' ج.م</td><td>'+(o.status||'')+'</td><td>'+(o.date||'')+'</td></tr>'}).join('');
document.getElementById('view').innerHTML=st+'<div class="panel"><h3>حالات الطلبات</h3>'+chips+'</div><div class="panel"><h3>أحدث الطلبات</h3><table class="tbl"><tr><th>#</th><th>العميل</th><th>العمولة</th><th>الحالة</th><th>التاريخ</th></tr>'+rows+'</table></div>';
}).catch(function(e){document.getElementById('view').innerHTML='<div class="panel">خطأ: '+e+'</div>';});}

var OSTATS=['جديد','تم التأكيد','تم الشحن','تم التوصيل','تم التحصيل','مرتجع','طلب استبدال','ملغي'];
var OF='الكل',OQ='';
function stColor(s){return (s==='تم التوصيل'||s==='تم التحصيل')?'background:#dcfce7;color:#047857':((s==='ملغي'||s==='مرتجع')?'background:#fee2e2;color:#b91c1c':(s==='جديد'?'background:#dbeafe;color:#1d4ed8':'background:#fef3c7;color:#92400e'))}
function rOrders(){fetch('/api/admin/orders').then(function(r){return r.json()}).then(function(list){window._orders=list||[];
document.getElementById('view').innerHTML='<div class="panel"><input id="oq" placeholder="🔍 ابحث بالاسم أو الهاتف" oninput="OQ=this.value;drawList()"></div><div id="ochips" style="margin:10px 0"></div><div id="olist"></div>';
drawChips();drawList();});}
function drawChips(){document.getElementById('ochips').innerHTML=['الكل'].concat(OSTATS).map(function(s){return '<span class="st" style="cursor:pointer;'+(OF===s?'background:var(--g);color:#fff':'background:#fff;border:1px solid var(--line)')+'" onclick="OF=\''+s+'\';drawChips();drawList()">'+s+'</span>'}).join('');}
function drawList(){var list=(window._orders||[]).filter(function(o){return (OF==='الكل'||o.status===OF)&&(!OQ||(o.client_name||'').indexOf(OQ)>-1||String(o.client_phone1||'').indexOf(OQ)>-1)});
document.getElementById('olist').innerHTML=list.map(function(o){var first=o.items&&o.items[0]?(o.items[0].name||''):'';
return '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:.85rem">'+(o.client_name||'')+'</b><span class="st" style="'+stColor(o.status)+'">'+(o.status||'')+'</span></div><div style="color:var(--mut);font-size:.72rem;margin:6px 0">📞 '+(o.client_phone1||'')+' • 💰 '+(o.commission||0)+' ج.م • 📅 '+(o.date||'')+'</div>'+(first?'<div style="font-size:.72rem;margin-bottom:8px">🛒 '+first+'</div>':'')+'<select style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit" onchange="chgStatus(\''+o.id+'\',this.value)">'+OSTATS.map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>';}).join('')||'<div class="panel">لا توجد طلبات هنا</div>';}
function chgStatus(id,st){fetch('/api/admin/order-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,status:st})}).then(function(){rOrders();});}


var PEDIT=null,PQ='';
var BS="background:var(--g);color:#fff;border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-weight:700";
var BG="background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit";
function rProducts(){fetch('/api/admin/products').then(function(r){return r.json()}).then(function(list){window._prods=list||[];
document.getElementById('view').innerHTML='<div class="panel"><button style="'+BS+'" onclick="showPForm()">➕ إضافة منتج</button><div id="pform" style="display:none;margin-top:12px"></div></div><div class="panel"><input id="pq" placeholder="🔍 ابحث عن منتج" oninput="PQ=this.value;drawProds()"></div><div id="plist" style="margin-top:10px"></div>';
drawProds();});}
function showPForm(p){PEDIT=p?p.id:null;var f=document.getElementById('pform');f.style.display='block';
f.innerHTML='<label>الاسم</label><input id="pfN" value="'+(p?p.name:'')+'"><label>السعر</label><input id="pfP" type="number" value="'+(p?p.price:'')+'"><label>التكلفة</label><input id="pfC" type="number" value="'+(p?p.cost:'')+'"><label>المخزون</label><input id="pfS" type="number" value="'+(p?p.stock:'')+'"><label>التصنيف</label><input id="pfCat" value="'+(p?p.cat:'')+'"><label>رابط الصورة</label><input id="pfI" value="'+(p?p.image:'')+'"><div style="display:flex;gap:8px;margin-top:12px"><button style="'+BS+'" onclick="saveProduct()">💾 حفظ</button><button style="'+BG+'" onclick="hidePForm()">إلغاء</button></div>';}
function hidePForm(){document.getElementById('pform').style.display='none';PEDIT=null;}
function saveProduct(){var o={name:document.getElementById('pfN').value,price:+document.getElementById('pfP').value||0,cost:+document.getElementById('pfC').value||0,stock:+document.getElementById('pfS').value||0,cat:document.getElementById('pfCat').value||'عام',image:document.getElementById('pfI').value};if(!o.name){alert('اكتب الاسم');return;}if(PEDIT)o.id=PEDIT;
fetch('/api/admin/product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(function(){hidePForm();rProducts();});}
function editById(id){var p=(window._prods||[]).find(function(x){return String(x.id)===String(id)});showPForm(p);}
function delProd(id){if(confirm('حذف المنتج؟'))fetch('/api/admin/product-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(){rProducts();});}
function drawProds(){var list=(window._prods||[]).filter(function(p){return !PQ||(p.name||'').indexOf(PQ)>-1});
document.getElementById('plist').innerHTML=list.map(function(p){return '<div class="panel" style="display:flex;gap:10px;align-items:center">'+(p.image?'<img src="'+p.image+'" style="width:52px;height:52px;object-fit:cover;border-radius:10px">':'')+'<div style="flex:1"><b style="font-size:.82rem">'+p.name+'</b><div style="color:var(--mut);font-size:.7rem">'+p.price+' ج.م • مخزون '+p.stock+' • '+p.cat+'</div></div><button style="'+BG+'" onclick="editById(\''+p.id+'\')">✏️</button><button style="'+BG+'" onclick="delProd(\''+p.id+'\')">🗑</button></div>';}).join('')||'<div class="panel">لا توجد منتجات — دوس「إضافة منتج」</div>';}


var BS="background:var(--g);color:#fff;border:none;border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-weight:700";
var BG="background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit";
var SQ='';
function rProducts(){Promise.all([fetch('/api/products').then(function(r){return r.json()}),fetch('/api/admin/price').then(function(r){return r.json()})]).then(function(res){var prods=res[0]||[],up=res[1].up||0;window._sprods=prods;
document.getElementById('view').innerHTML='<div class="panel"><h3>💸 رفع أسعار كل المنتجات</h3><div style="color:var(--mut);font-size:.72rem;margin-bottom:8px">الزيادة المطبقة حالياً: <b style="color:var(--g)">'+up+'%</b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="pup" type="number" placeholder="%" style="width:80px;padding:10px;border:1.5px solid var(--line);border-radius:10px"><button style="'+BS+'" onclick="applyUp()">تطبيق</button><button style="'+BG+'" onclick="setUp(5)">+5%</button><button style="'+BG+'" onclick="setUp(10)">+10%</button><button style="'+BG+'" onclick="setUp(20)">+20%</button><button style="'+BG+'" onclick="setUp(0)">إعادة الأسعار الأصلية</button></div></div><div class="panel"><input id="spq" placeholder="🔍 ابحث في المنتجات" oninput="SQ=this.value;drawStoreProds()"></div><div id="splist" style="margin-top:10px"></div>';
drawStoreProds();});}
function drawStoreProds(){var all=(window._sprods||[]).filter(function(p){return !SQ||(p.name||'').indexOf(SQ)>-1});var list=all.slice(0,60);
document.getElementById('splist').innerHTML='<p style="color:var(--mut);font-size:.7rem;margin-bottom:8px">معروض '+list.length+' من '+all.length+' منتج</p>'+list.map(function(p){return '<div class="panel" style="display:flex;gap:10px;align-items:center">'+(p.image?'<img src="'+p.image+'" style="width:50px;height:50px;object-fit:cover;border-radius:10px">':'')+'<div style="flex:1"><b style="font-size:.8rem">'+p.name+'</b><div style="color:var(--g);font-weight:800;font-size:.8rem">'+p.price+' ج.م</div></div></div>';}).join('')||'<div class="panel">لا يوجد منتجات</div>';}
function applyUp(){setUp(+document.getElementById('pup').value||0);}
function setUp(v){fetch('/api/admin/price-up',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({up:v})}).then(function(){rProducts();});}


var UQ='';
function rUsers(){fetch('/api/admin/users').then(function(r){return r.json()}).then(function(list){window._users=list||[];
document.getElementById('view').innerHTML='<div class="panel"><input id="uq" placeholder="🔍 ابحث عن مستخدم" oninput="UQ=this.value;drawUsers()"></div><div id="ulist" style="margin-top:10px"></div>';drawUsers();});}
function timeAgo(ts){var d=Date.now()-ts;var m=Math.floor(d/60000);if(m<1)return 'الآن';if(m<60)return 'منذ '+m+' د';var h=Math.floor(m/60);if(h<24)return 'منذ '+h+' س';return 'منذ '+Math.floor(h/24)+' يوم';}
function drawUsers(){var list=(window._users||[]).filter(function(u){return !UQ||(u.name||'').indexOf(UQ)>-1||(u.contact||'').indexOf(UQ)>-1});
document.getElementById('ulist').innerHTML=list.map(function(u){
var st=u.banned?'<span class="st" style="background:#fee2e2;color:#b91c1c">🚫 محظور</span>':(u.online?'<span class="st" style="background:#dcfce7;color:#047857">● متصل</span>':'<span class="st" style="background:#f1f5f9;color:#64748b">غير متصل</span>');
return '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:.85rem">'+u.name+'</b>'+st+'</div><div style="color:var(--mut);font-size:.72rem;margin:6px 0">📞 '+u.contact+' • 💰 '+u.balance+' ج.م</div><div style="color:var(--mut);font-size:.7rem">🕐 آخر ظهور: '+(u.lastSeen?timeAgo(u.lastSeen):'—')+'</div><button style="'+(u.banned?BG:BS)+';margin-top:8px" onclick="banUser(\''+u.id+'\','+(!u.banned)+')">'+(u.banned?'✅ فك الحظر':'🚫 حظر المستخدم')+'</button></div>';}).join('')||'<div class="panel">لا يوجد مستخدمون مسجلون</div>';}
function banUser(id,b){fetch('/api/admin/user-ban',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,banned:b})}).then(function(){rUsers();});}


function rUsers(){clearInterval(window._uT);fetch('/api/admin/users').then(function(r){return r.json()}).then(function(list){window._users=list||[];
document.getElementById('view').innerHTML='<div class="panel" style="display:flex;justify-content:space-between;align-items:center"><input id="uq" placeholder="🔍 ابحث عن مستخدم" oninput="UQ=this.value;drawUsers()" style="flex:1"><span class="st" style="background:#dcfce7;color:#047857">● لايف</span></div><div id="ulist" style="margin-top:10px"></div>';
drawUsers();window._uT=setInterval(refreshUsers,5000);});}
function refreshUsers(){if(!document.getElementById('ulist'))return;fetch('/api/admin/users').then(function(r){return r.json()}).then(function(l){window._users=l;drawUsers();});}
function drawUsers(){var el=document.getElementById('ulist');if(!el)return;var list=(window._users||[]).filter(function(u){return !UQ||(u.name||'').indexOf(UQ)>-1||(u.contact||'').indexOf(UQ)>-1});
el.innerHTML=list.map(function(u){
var st=u.banned?'<span class="st" style="background:#fee2e2;color:#b91c1c">🚫 محظور</span>':(u.online?'<span class="st" style="background:#dcfce7;color:#047857">● متصل</span>':'<span class="st" style="background:#f1f5f9;color:#64748b">غير متصل</span>');
return '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:.85rem">'+u.name+'</b>'+st+'</div><div style="color:var(--mut);font-size:.72rem;margin:6px 0">📞 '+u.contact+' • 💰 '+u.balance+' ج.م</div>'+(u.lastAction?'<div style="color:var(--g);font-size:.72rem;font-weight:700">🔎 النشاط الآن: '+u.lastAction+'</div>':'')+'<div style="color:var(--mut);font-size:.7rem">🕐 آخر ظهور: '+(u.lastSeen?timeAgo(u.lastSeen):'—')+'</div><button style="'+(u.banned?BG:BS)+';margin-top:8px" onclick="banUser(\''+u.id+'\','+(!u.banned)+')">'+(u.banned?'✅ فك الحظر':'🚫 حظر المستخدم')+'</button></div>';}).join('')||'<div class="panel">لا يوجد مستخدمون</div>';}


function rUsers(){clearInterval(window._uT);fetch('/api/admin/users').then(function(r){return r.json()}).then(function(list){window._users=list||[];
document.getElementById('view').innerHTML='<div class="panel" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><input id="uq" placeholder="🔍 ابحث بالاسم أو الرقم" oninput="UQ=this.value;drawUsers()"></div><span class="st" style="background:#dcfce7;color:#047857">● لايف</span></div><div id="ulist" style="margin-top:12px"></div>';
drawUsers();window._uT=setInterval(refreshUsers,5000);});}
function toggleU(id){window._expU=(window._expU===id?null:id);drawUsers();}
function drawUsers(){var el=document.getElementById('ulist');if(!el)return;
var list=(window._users||[]).filter(function(u){return !UQ||(u.name||'').indexOf(UQ)>-1||(u.contact||'').indexOf(UQ)>-1});
el.innerHTML=list.map(function(u){
